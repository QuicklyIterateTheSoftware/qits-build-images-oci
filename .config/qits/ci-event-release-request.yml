# THE ONE QA PIPELINE THIS REPOSITORY HAS, and it runs for a release request and nothing else.
#
# There is no push pipeline any more, and `ci-post-receive.yml` is what this file replaces.
# qits-projects keeps a backing branch `release/<id>` per open release request — an octopus merge of
# that request's sources, refolded whenever the set changes — and publishes `ReleaseRequestChanged`
# on every successful re-fold. The merge primitive that writes that branch fires no `post-receive`
# and so publishes no `SCMPublishCommit`: without this file the fold exists and NOTHING BUILDS IT.
# A fold the git host answered `unchanged`, and one that conflicted, publish nothing — so every
# arrival here is a new sha worth a build.
#
# DECIDED AT MAIN, BUILT AT THE FOLD. This file is discovered, parsed and selected at `main`'s head,
# always; only the run's branch and sha come from the payload, which is why `checkout:` names them
# as a pair — a sha with no branch whose history holds it is not something a step container can
# fetch. A release request therefore cannot alter the CI that gates it by folding in a commit that
# edits this file. Inside a step, $QITS_CI_BRANCH is `release/<id>` and $QITS_CI_SHA is the merged
# sha; the fold is already checked out, so nothing below fetches or switches refs.
#
# EVERY STEP HERE IS GATING, and there is no trailing `gating: false` half because this repository
# publishes nothing from a fold. The verdict returns on the ordinary `BuildSuccessful`/`BuildFailed`
# with `commitSha` = the merged sha, which is what qits-projects' `BuildStatusListener` matches on
# together with `repoId`.
#
# ci-event-release.yml BESIDE THIS FILE IS UNTOUCHED and is still the other half: it reacts to this
# repository's release TAG and publishes the released coordinate. This file names a build by the
# merged sha; that one names a release by its version. Neither pushes the other's coordinate.
#
# WHY THERE IS NO PUSH HERE, unlike qits-oci-postgresql's. That repository builds ONE image which a
# deployment then runs at the built sha, so a sha-tagged push is the whole contract. These five are
# the images every OTHER repository's steps run, and the tag they are consumed under is `latest` —
# so a push from an unreleased branch that wrote `latest` would make an unreviewed Dockerfile the
# thing the entire platform builds on, silently, from the moment it landed. Publishing stays the
# release pipeline's alone (`ci-event-release.yml`), which is the only place the shared CalVer
# exists.
#
# So what this pipeline is for is the OTHER half of a release: finding out that a Dockerfile still
# builds, on the fold that carries the change, rather than at release time when the answer arrives
# with nothing to do about it. That matters more here than anywhere: this repository's release is
# the one that cannot be retried by CI if it lands broken, because the step image a retry would
# need is the artifact the release publishes.
#
# BUILT, NOT PULLED, and that is the point of the exercise. These images used to exist only in the
# host's local docker store, put there by the bootstrap, because every recipe names them
# unqualified — so a `docker system prune` deleted the whole CI plane and only a bootstrap rerun
# brought it back. qits-ci resolves an unqualified platform image against the registry now (see
# CiStepImage), ci-event-release.yml publishes every one of them there, and this file is what keeps
# them building between releases.
#
# No `--network` flag: nothing in these builds dials the platform.

event: ReleaseRequestChanged

when:
  # repoName, not repoId: the git host's storage coordinate is an opaque UUID since
  # the identity cutover, so a name match on repoId is not dependable. The event
  # echoes the public name; a rename updates this line in the same campaign.
  - repoName: { exact: qits-build-images-oci }

checkout:
  branch: backingBranch
  sha: mergedSha

steps:
  - # UPSTREAM, NOT ONE OF OURS, and that is the whole point of this line. This pipeline builds the
    # five images every other repository's steps run in; naming one of them here made them buildable
    # only by a machine that already had them, so a `docker system prune` on 2026-08-20 deleted the
    # platform's entire CI plane with no run left anywhere able to rebuild it.
    #
    # docker:28-dind is the one upstream image that carries docker AND git, which is the daemon's
    # image contract (git plus a downloader; busybox wget is the downloader). It has no bash, which
    # is why qits-ci-daemon stopped requiring one and runs a script under sh when bash is absent —
    # every script in this file is POSIX. It is pulled through the platform's OCI mirror like any
    # other library image.
    image: docker:28-dind
    docker: true
    timeout-seconds: 3600
    script: |
      set -eu

      images='ci-base maven-base userflows-base node-base node-docker-base'

      # Tagged with the sha only so the local store has a name to hold the result under; nothing is
      # pushed and nothing named `latest` is written, so a concurrent release's `latest` is never
      # this branch's. Kept one `-t` per build for the reason the release file argues at length:
      # BuildKit's exporter does not reliably leave every alias of a multi-tag build in the store.
      for image in $images; do
        docker build \
          -f "$image/Dockerfile" \
          -t "qits-build-images-oci-push/$image:$QITS_CI_SHA" \
          .
      done

      # NO `docker rmi`: on a CI host it frees nothing — the layers stay in the builder's cache
      # either way — while under the containerd image store it drops the last reference to content
      # a concurrent build of this same Dockerfile may still be resolving, which is the race that
      # broke the release of 2026-08-11. Two builds of these Dockerfiles do run concurrently: this
      # one and the release pipeline's.
